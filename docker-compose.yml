services:
  db:
    image: postgres:16-alpine
    container_name: pricepulse-db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pricepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pricepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pricepulse-network

  redis:
    image: redis:7-alpine
    container_name: pricepulse-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pricepulse-network

  api:
    build:
      context: ./backend
      network: host
    container_name: pricepulse-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pricepulse}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - pricepulse-network

  worker:
    build:
      context: ./backend
      network: host
    container_name: pricepulse-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pricepulse}
      - REDIS_URL=redis://redis:6379/0
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - pricepulse-network

  frontend:
    build:
      context: ./frontend
      network: host
    container_name: pricepulse-frontend
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - pricepulse-network

networks:
  pricepulse-network:
    driver: bridge

volumes:
  postgres_data:
